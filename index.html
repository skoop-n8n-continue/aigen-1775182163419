<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="manifest" href="./manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Hotel In-Room Display</title>
    <link rel="stylesheet" href="styles.css?v=hotel778">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app-container">
        <div class="background-overlay"></div>
        <div class="app-layout">
            <!-- Sidebar Navigation -->
            <nav class="sidebar">
                <div class="hotel-logo">
                    <span class="logo-text" id="hotel-name"></span>
                </div>
                <div class="nav-items" id="nav-container">
                    <!-- Nav items will be rendered here -->
                </div>
                <div class="sidebar-footer">
                    <div id="current-time">12:00 PM</div>
                    <div id="current-date">Friday, April 3</div>
                </div>
            </nav>

            <main class="main-content">
                <!-- Header Section -->
                <header class="welcome-section">
                    <h1 class="welcome-text">Welcome, <span id="guest-name"></span></h1>
                    <div class="weather-widget">
                        <span id="weather-temp">72°F</span>
                        <span id="weather-desc">Partly Cloudy</span>
                        <span class="weather-location" id="location"></span>
                    </div>
                </header>

                <!-- Dynamic Content Grid -->
                <div class="content-grid">
                    <!-- TV Guide -->
                    <section class="grid-card tv-guide">
                        <h3>TV Guide</h3>
                        <div class="tv-list" id="tv-guide-container">
                            <!-- TV items will be rendered here -->
                        </div>
                    </section>

                    <!-- Local Attractions -->
                    <section class="grid-card attractions" id="attractions-container">
                        <h3>Local Attractions</h3>
                        <!-- Attraction items will be rendered here -->
                    </section>

                    <!-- Nearby Dining -->
                    <section class="grid-card restaurants" id="restaurants-container">
                        <h3>Nearby Dining</h3>
                        <!-- Restaurant items will be rendered here -->
                    </section>

                    <!-- Room Service CTA -->
                    <section class="grid-card room-service">
                        <div class="cta-banner">
                            <img src="" alt="Room Service" id="room-service-image">
                            <div class="cta-overlay">
                                <h3 id="room-service-title"></h3>
                                <p id="room-service-desc"></p>
                                <button class="cta-button" id="room-service-cta"></button>
                            </div>
                        </div>
                    </section>
                </div>
            </main>
        </div>
    </div>

    <script src="script.js?v=hotel778"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./sw.js')
          .then(function (reg) { console.log('[PWA] SW registered:', reg.scope); })
          .catch(function (err) { console.warn('[PWA] SW registration failed:', err); });
      });
    }
  </script>
</body>
</html>
